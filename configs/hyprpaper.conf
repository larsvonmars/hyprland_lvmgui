# The desktop's wallpaper, and the same picture the lock screen draws behind
# itself - that is why this file lives next to hyprlock.conf: the background of
# the desktop and the background of the lock screen are one image, and this is
# the one place it is decided.
#
# Installed from hyprland_lvmgui/configs/hyprpaper.conf by scripts/install.sh,
# but only when hyprpaper is installed and this file does not exist yet - it is
# meant to be edited, so re-running the installer will not undo your changes.
#
# To change the wallpaper without editing anything, hyprpaper's IPC:
#
#     hyprctl hyprpaper wallpaper ",/path/to/image.jpg"   # empty monitor = all
#     hyprctl hyprpaper listactive                        # what is on each monitor
#
# `path` may also be a *directory*: hyprpaper then walks it, changing the picture
# every `timeout` seconds, with `order = random` to shuffle and `recursive = true`
# to descend - that is how to get a slideshow instead of one picture.

# The hyprland splash logo over a freshly loaded wallpaper is charming once and
# noise afterwards; the desktop should simply appear.
splash = false

# On, so the two commands above work.
ipc = on

# One block is enough for one wallpaper: the empty `monitor` makes it the
# fallback, which is what a single-screen setup wants. The newer hyprpaper syntax
# has no `preload`/`wallpaper = monitor,path` lines any more (0.8 replaced them
# with this block form).
wallpaper {
    monitor =
    # The one machine-specific line in this file. 3840x2160 - it covers this
    # panel's 2736x1824 without being upscaled.
    path = /home/lars/Bilder/Wallpapers/1022522.jpg
    # cover fills the monitor and crops the overflow; `contain` would letterbox
    # a picture that does not match the screen's aspect.
    fit_mode = cover
}
