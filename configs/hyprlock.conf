# The lock screen, in the bar's language.
#
# hyprlock reads its own config (hyprlang: this file) and cannot see the bar's
# stylesheet, so the palette is mirrored here as variables - the same
# @define-color values from ~/.config/waybar/style.css that theme.py reads for
# the bar's popups and that the OSDs' base.css mirrors, converted to hyprlock's
# #RRGGBBAA. Change a colour there and change it here: that is the deal every
# other file in this theme makes.
#
# Installed from hyprland_lvmgui/configs/hyprlock.conf by scripts/install.sh.
#
# To check an edit *without* locking yourself out, point hyprlock at a display
# that does not exist - it reads the config first, prints any errors with their
# line numbers, and only then fails to connect (so it cannot lock anything):
#
#     WAYLAND_DISPLAY=none hyprlock --config ~/.config/hypr/hyprlock.conf -v
#
# To *look* at an edit without locking anything either, run hyprlock inside a
# throwaway nested compositor and screenshot that. The recipe is in the README
# under "Lock screen", and every number below was chosen with it.
#
# Errors are not fatal ("proceeding ignoring faulty entries"), which is why they
# are worth reading: a typo usually means an element silently uses its default.

# ---- palette (waybar/style.css, as #RRGGBBAA) ----
$bg        = rgba(0b0f15eb)   # rgba(11, 15, 21, 0.92)
$fg        = rgb(dde7ef)
$fg_dim    = rgb(8b98a8)
$fg_faint  = rgb(4d5661)
$accent    = rgb(33ccff)
$accent2   = rgb(00ff99)
$warn      = rgb(ffcc66)
$crit      = rgb(ff5566)
$border    = rgba(33ccff38)   # rgba(51, 204, 255, 0.22)
$surface   = rgba(ffffff0c)   # rgba(255, 255, 255, 0.045)

# Two tokens that are not in waybar's stylesheet but are cut from it, so that no
# colour on this screen is invented here: the accent at two opacities.
$accent_soft = rgba(33ccff99) # = $accent at 60%, the rule under the clock
$glass       = rgba(33ccff14) # = $accent at 8%, the field's fill

# ---- behaviour ----
# The cursor is not part of a lock screen; an empty Enter is not a wrong password
# (so it should not count as a failed attempt); and a failed attempt stays red for
# two seconds before the field fades back.
general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
    # Draw the widgets immediately instead of waiting for the screenshot: until
    # it arrives the background is `$bg`, so the lock is up (and looks
    # deliberate) a beat earlier and the glass fades in underneath it.
    immediate_render = true
}

# ---- the screen behind everything ----
# The desktop's own wallpaper, not a screenshot of the desktop: what should be
# behind the lock screen is the background you chose, not a blurred photograph of
# whatever windows were open. It also means the lock screen never shows the shape
# of what you were working on.
#
# The picture is chosen in `hyprpaper.conf`, the file next to this one - hyprlock
# cannot read hyprpaper's config, so the path is written again here: change a
# wallpaper, change both lines. hyprlock draws a still image, so a *video*
# wallpaper would need a frame of it (`ffmpeg -ss 3 -i <video> -frames:v 1 out.png`)
# and `screenshot` re-takes the live desktop on every lock instead.
background {
    monitor =
    path = /home/lars/Bilder/Wallpapers/1022522.jpg
    # Deliberately almost nothing: this is the wallpaper, so it should look like
    # the wallpaper. One blur pass of 1px (the pipeline needs a pass for the
    # brightness below to apply at all, and 1px is invisible), a light dim so a
    # bright picture does not glare at midnight, and a whisper of grain. Raise
    # `blur_size` to 8-16 for frosted glass, `brightness` to 1 to hand the
    # picture over untouched, and avoid `blur_passes = 0` - it skips the rest.
    blur_passes = 1
    blur_size = 1
    brightness = 0.7
    contrast = 1.02
    vibrancy = 0.1
    vibrancy_darkness = 0.1
    noise = 0.004
    color = $bg
}

# ---- the glass panel ----
# One sheet of dark glass behind the whole arrangement, so the type sits on a
# known contrast instead of on whatever the wallpaper is doing - the job the OSD
# cards' `box.card` does, one layer down. `zindex = -1` is what keeps it above
# the background (also -1, but declared first) and below every piece of type.
shape {
    monitor =
    size = 800, 670
    position = 0, 0
    halign = center
    valign = center
    rounding = 32
    color = rgba(0b0f15a6)   # $bg, a little more transparent
    border_size = 1
    border_color = $border
    zindex = -1
    # Large and soft: the panel has to read as lifted off the wallpaper, not as
    # a rectangle painted onto it.
    shadow_color = rgba(000000a6)
    shadow_size = 36
    shadow_passes = 2
    shadow_boost = 1
}

# ---- clock and date ----
# Positions are relative to the middle of the monitor (x to the right, **y up**:
# a positive y is *above* the centre, which is the opposite of what you would
# guess and what hyprlock's documentation does not say - it was measured by
# rendering this file, not by reading). So the clock sits at +109 and the hint at
# -266, and the whole arrangement reads top to bottom.
label {
    monitor =
    # The colon is $accent, written out: pango markup is a string, so it cannot
    # see hyprlang variables, and `##` is how hyprlang escapes a literal `#`.
    text = cmd[update:1000] echo "$(date +'%H')<span foreground='##33ccff'>:</span>$(date +'%M')"
    font_family = MesloLGS Nerd Font Mono
    font_size = 170
    color = $fg
    position = 0, 109
    halign = center
    valign = center
    zindex = 1
    shadow_color = rgba(00000080)
    shadow_size = 18
    shadow_passes = 2
    shadow_boost = 1.1
}

# The date, set in caps the way a title is: it is the second line of the same
# thought, so it takes the accent's spacing habits rather than the clock's size.
# It sits 150 above the clock's centre because a 170px line box is far taller
# than the digits in it - the gap you see is smaller than the number suggests.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %-d %B' | tr '[:lower:]' '[:upper:]')"
    font_family = MesloLGS Nerd Font Mono
    font_size = 26
    color = $fg_dim
    position = 0, 259
    halign = center
    valign = center
    zindex = 1
    shadow_color = rgba(00000066)
    shadow_size = 10
    shadow_passes = 1
}

# A short accent rule where the clock and the field meet. Pure decoration, and
# the only place the accent appears until the field's border picks it up.
shape {
    monitor =
    size = 84, 3
    position = 0, -31
    halign = center
    valign = center
    rounding = 2
    color = $accent_soft
    zindex = 1
}

# The lock glyph: the same nf-fa-lock (U+F023) the session card's Lock row wears.
label {
    text = 󰌾
    font_family = MesloLGS Nerd Font Mono
    font_size = 44
    color = $fg_faint
    position = 0, -91
    halign = center
    valign = center
    zindex = 1
}

# ---- the password field ----
# The settings app's text input, scaled up: a taller box, so the dots and the
# placeholder are legible from arm's length, an accent-tinted glass fill, and the
# bar's gradient on the outline (the one place on this screen where the accent
# and the accent2 meet, the same pair the bar's progress fill uses).
#
# `fade_on_empty` is what makes the field *appear*: with `fade_timeout = 0` it is
# invisible while the buffer is empty and fades in with the first keystroke. A
# permanent empty box says "type here" even when the screen is not asking; this
# one only shows the box once you have started answering. hyprlock cannot gate
# that on one particular key - the field follows the buffer, not the key that
# filled it - but once there is something to submit, Enter is what submits it.
input-field {
    monitor =
    size = 440, 78
    position = 0, -186
    halign = center
    valign = center
    zindex = 1
    rounding = 20

    inner_color = $glass
    font_color = $fg
    font_family = MesloLGS Nerd Font Mono
    dots_size = 0.3
    dots_spacing = 0.2
    dots_center = true

    # The outline is what is drawn around `inner_color`, and it carries the
    # state: `$border` at rest, @accent while PAM is thinking, @crit red when the
    # password is wrong, @warn amber while capslock is on. The gradient narrows
    # to its first colour for those, which is why the first one is the accent.
    outline_thickness = 2
    outer_color = rgba(33ccff66) rgba(00ff9933)
    check_color = $accent
    fail_color = $crit
    capslock_color = $warn

    placeholder_text = <i>Password</i>
    check_text = <i>Verifying…</i>
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = true
    fade_timeout = 0

    shadow_color = rgba(00000099)
    shadow_size = 20
    shadow_passes = 2
    shadow_boost = 1
}

# ---- the resting hint ----
# The field is invisible while it is empty, so at rest this is what says what to
# do - and it says it below the field, where the placeholder would have been.
# `$ATTEMPTS[...]` renders the string only while there have been no failed
# attempts: once there is something to report, the field says it and this line
# gets out of the way.
label {
    monitor =
    text = $ATTEMPTS[Type your password]
    font_family = MesloLGS Nerd Font Mono
    font_size = 20
    color = $fg_dim
    position = 0, -266
    halign = center
    valign = center
    zindex = 1
}

# ---- what the desktop has to say for itself ----
# The lock screen gets the keyboard and nothing else: no OSD card can appear here
# (elements take no keyboard focus, and the session is locked anyway). This is
# hyprlock's own "no, try again" line, coloured like the bar's critical state.
auth {
    pam:enabled = true
}
