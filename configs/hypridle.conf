# Idle behaviour: lock, blank the panel, then sleep.
#
# hyprlock knows how to *draw* a lock screen; hypridle is what decides to show
# it. Nothing locks by itself without hypridle - the session card's Lock row and
# SUPER + L still lock on demand, they just are not triggered by time.
#
# Installed from hyprland_lvmgui/configs/hypridle.conf by scripts/install.sh.
#
# The general block is the interesting half:
#   lock_cmd          runs when anything asks for a session lock. The `pidof`
#                     guard keeps a second request (a second idle event, a second
#                     key press, `loginctl lock-session` from a script) from
#                     starting a second locker.
#   before_sleep_cmd  runs when the machine is about to suspend - whichever way
#                     it was asked to, including the session card's Suspend row.
#                     This is the one piece of the "suspend locks first" rule that
#                     cannot live in an element: the element only runs when its
#                     row is pressed, and `systemctl suspend` from anywhere else
#                     should also wake up to a lock screen.
#   after_sleep_cmd   brings the panel back after a resume; some firmware leaves
#                     it off, and a black screen after sleep looks like a crash.
general {
    lock_cmd = pidof hyprlock >/dev/null || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 minutes: lock. A starting point rather than a preference - quick enough that
# walking away is covered, slow enough that reading is not interrupted.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutes: blank the panel. `on-resume` wakes it again, so the first key press
# or mouse movement after the blank does not leave you on a black screen.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 minutes: sleep - the reason to handle idle on a laptop at all.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
